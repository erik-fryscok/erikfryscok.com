name: Bug report
description: Report a reproducible defect in the website or its delivery workflow.
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include browser, device, URL, screenshots, logs, or other useful evidence.
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Content safety
      options:
        - label: This report contains no credentials or confidential information.
          required: true
